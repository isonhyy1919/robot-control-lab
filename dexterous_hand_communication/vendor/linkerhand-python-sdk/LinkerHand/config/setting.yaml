VERSION: 3.1.1 # 支持O6、L6在RS485模式
LINKER_HAND:  # 手部配置信息
  LEFT_HAND:
    EXISTS: False # 是否存在左手
    TOUCH: True # 是否有压力传感器
    CAN: "can0"  # 配置 CAN 端口，默认值为 can0。如果 MODBUS 不为 "None"，则 CAN 配置不生效。如果是 Windows 系统，则类似于 PCAN_USBBUS1。注：蓝色盒子在 Linux 下对应 can0，在 Windows 下对应 PCAN_USBBUS1；透明盒子在 Linux 下对应 can0，在 Windows 下对应 0。
    MODBUS: "None" # 通讯协议是否为485 默认None 如果启动485，则是设备端口 /dev/ttyUSB* CAN配置失效 当前只支持O6/L6.后续版本正在努力增加中
    JOINT: O6 # 左手型号 O6/L6/L7/L10/L20/G20/L21/L25/
    NAME: # 默认值，不用修改
      - joint41
      - joint42
      - joint43
      - joint44
      - joint45
      - joint46
      - joint47
      - joint48
      - joint49
      - joint50
      - joint51
      - joint52
      - joint53
      - joint54
      - joint55
      - joint56
      - joint57
      - joint58
      - joint59
      - joint60
    
  RIGHT_HAND:
    EXISTS: True # 是否存在右手
    TOUCH: False # 当前 L20 Lite 不使用触觉传感器
    CAN: "PCAN_USBBUS1"  # Windows 下的 PEAK PCAN-USB 通道
    MODBUS: "None" # 通讯协议是否为485 默认None 如果启动485，则是设备端口 /dev/ttyUSB* CAN配置失效 当前只支持O6/L6.后续版本正在努力增加中
    JOINT: L10 # L20 Lite 当前固件自报 LHT10，官方 Dashboard 26.4.0 按 L10 蜗轮协议控制
    NAME:  # 默认值，不用修改
      - joint71
      - joint72
      - joint73
      - joint77
      - joint75
      - joint76
      - joint77
      - joint78
      - joint79
      - joint80
      - joint81
      - joint82
      - joint83
      - joint84
      - joint88
      - joint86
      - joint87
      - joint88
      - joint89
      - joint90
PASSWORD: "" # Windows 无需密码；Linux 请在本机配置，勿提交真实密码
